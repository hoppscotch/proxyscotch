name: Build Proxyscotch

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    name: Linux Build
    runs-on: ubuntu-22.04
    steps:
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev
      - name: Checkout
        uses: actions/checkout@v2
      - name: Unshallow
        run: git fetch --prune --unshallow
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23.7'
      - name: Run Builds
        run: |
          rm -rf ./out ./dist
          mkdir ./dist
          ./build.sh linux server arch=amd64
          mv out/linux-server/proxyscotch-server-* dist/
          ./build.sh linux server arch=arm64
          mv out/linux-server/proxyscotch-server-* dist/
          ./build.sh linux desktop arch=amd64
          mv out/linux-desktop/Proxyscotch-Desktop-* dist/
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: ./dist/*
          if-no-files-found: error

  build-darwin:
    name: Darwin Build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Unshallow
        run: git fetch --prune --unshallow
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23.7'
      - name: Run Builds
        run: |
          rm -rf ./out ./dist
          mkdir ./dist
          ./build.sh darwin server arch=amd64
          mv out/darwin-server/proxyscotch-server-* dist/
          ./build.sh darwin server arch=arm64
          mv out/darwin-server/proxyscotch-server-* dist/
          ./build.sh darwin desktop arch=universal
          mv out/darwin-desktop/Proxyscotch-Desktop-*.zip dist/
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-darwin
          path: ./dist/*
          if-no-files-found: error

  build-windows:
    name: Windows Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Unshallow
        run: git fetch --prune --unshallow
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23.7'
      - name: Run Builds
        run: |
          rm -rf ./out ./dist
          mkdir ./dist
          ./build.sh windows server arch=amd64
          mv out/windows-server/proxyscotch-server-* dist/
          ./build.sh windows server arch=arm64
          mv out/windows-server/proxyscotch-server-* dist/
          ./build.sh windows desktop arch=amd64
          mv out/windows-desktop/Proxyscotch-Desktop-*.exe dist/
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: ./dist/*
          if-no-files-found: error

  generate-release:
    name: Execute Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-darwin, build-windows]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: ./release
      - name: Load version information
        run: |
          source ./version.properties
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
      # Version-free copies keep releases/latest/download/<name> links stable across releases.
      - name: Add version-free copies
        working-directory: ./release
        run: |
          for f in *-v"$VERSION_NAME"*; do
            cp "$f" "${f/-v$VERSION_NAME/}"
          done
          ls -l
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v$VERSION_NAME" ./release/* \
            --verify-tag \
            --title "Release v$VERSION_NAME" \
            --notes ""
